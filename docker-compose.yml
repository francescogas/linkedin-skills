# docker compose up -d      (reads secrets from your shell or a local .env that is NOT committed)
services:
  studio:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8765:8765"]      # put a TLS reverse proxy in front for remote access
    environment:
      APP_TOKEN: ${APP_TOKEN:?set APP_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_CHAIN: ${LLM_CHAIN:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      PUBLORA_API_KEY: ${PUBLORA_API_KEY:-}
      LINKEDIN_PLATFORM_ID: ${LINKEDIN_PLATFORM_ID:-}
      PIXFARO_TOKEN: ${PIXFARO_TOKEN:-}
    volumes: ["studio-data:/data"]
volumes:
  studio-data:
